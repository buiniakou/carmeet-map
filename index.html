<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Car Meet Spots</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  :root { --bg:#111317; --panel:#1a1d23; --line:#2a2f38; --text:#e8eaed; --muted:#9aa0a6; --accent:#ff4d4d; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px/1.4 system-ui, -apple-system, sans-serif; }
  #app { display:flex; height:100%; }
  #side { width:300px; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; }
  #side header { padding:14px 16px; border-bottom:1px solid var(--line); }
  #side h1 { margin:0 0 4px; font-size:18px; display:flex; align-items:center; gap:8px; }
  #side h1 i { color:var(--accent); }
  #side p { margin:0; color:var(--muted); font-size:12px; }
  .search { position:relative; margin:10px 16px; }
  .search i { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:12px; }
  #search { width:100%; padding:8px 10px 8px 30px; background:var(--bg); border:1px solid var(--line); color:var(--text); border-radius:6px; font:inherit; }
  #list { flex:1; overflow-y:auto; padding:0 8px; }
  .item { display:flex; gap:10px; align-items:flex-start; padding:10px; border-radius:6px; cursor:pointer; border-bottom:1px solid var(--line); }
  .item:hover { background:#232730; }
  .item > i { color:var(--accent); margin-top:3px; }
  .item b { display:block; }
  .item span { color:var(--muted); font-size:12px; }
  .empty { color:var(--muted); padding:16px 8px; }
  #tools { padding:12px 16px; border-top:1px solid var(--line); display:flex; gap:8px; flex-wrap:wrap; }
  button, .btn { display:inline-flex; align-items:center; gap:6px; background:#2a2f38; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:7px 10px; cursor:pointer; font:inherit; }
  button:hover, .btn:hover { background:#353b46; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger { color:#ff8a8a; }
  #map { flex:1; background:#143d55; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background:var(--panel); color:var(--text); }
  .leaflet-popup-content { margin:12px; min-width:220px; }
  .leaflet-container a.leaflet-popup-close-button { color:var(--muted); }
  form label { display:block; font-size:12px; color:var(--muted); margin:8px 0 3px; }
  form input, form textarea { width:100%; padding:6px 8px; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:5px; font:inherit; }
  form textarea { min-height:60px; resize:vertical; }
  .row { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  .pin { position:relative; width:30px; height:40px; }
  .pin .fa-location-pin { position:absolute; inset:0; font-size:40px; color:var(--accent); filter:drop-shadow(0 2px 3px #000b); }
  .pin .fa-car-side { position:absolute; left:50%; top:9px; transform:translateX(-50%); font-size:13px; color:#fff; }
  .pop h3 { margin:0 0 6px; font-size:15px; }
  .pop .notes { white-space:pre-wrap; color:#cfd3d8; }
  @media (max-width: 700px) {
    #app { flex-direction:column-reverse; }
    #side { width:100%; height:40%; border-right:0; border-top:1px solid var(--line); }
  }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <header>
      <h1><i class="fa-solid fa-car-side"></i> Car Meet Spots</h1>
      <p>Click anywhere on the map to drop a spot.</p>
    </header>
    <div class="search"><i class="fa-solid fa-magnifying-glass"></i><input id="search" placeholder="Search spots"></div>
    <div id="list"></div>
    <div id="tools">
      <button id="export"><i class="fa-solid fa-download"></i> Export</button>
      <label class="btn"><i class="fa-solid fa-upload"></i> Import<input id="import" type="file" accept=".json" hidden></label>
    </div>
  </aside>
  <div id="map"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// The map is 8192x8192 px, cut into 256px tiles at zooms 0-5 (tiles/{z}/{y}/{x}.jpg).
// Coordinates: 1 unit = 32 px at full size, so the map spans lng 0..256 and lat 0..-256.
const KEY = 'carmeet-spots-v2';
const OLD_KEY = 'carmeet-spots-v1';
const EXTENT = 256;

const map = L.map('map', {
  crs: L.CRS.Simple, minZoom: 0, maxZoom: 7, zoomSnap: 0.5, zoomDelta: 0.5,
  wheelPxPerZoomLevel: 90, attributionControl: false,
});
const bounds = L.latLngBounds([-EXTENT, 0], [0, EXTENT]);
L.tileLayer('tiles/{z}/{y}/{x}.jpg', {
  tileSize: 256, minNativeZoom: 0, maxNativeZoom: 5, noWrap: true, bounds,
  keepBuffer: 4, updateWhenZooming: false,
}).addTo(map);
map.fitBounds(bounds);
map.setMaxBounds(bounds.pad(0.2));

let spots = load();
const markers = {};

// Spots from the first version used 0..8192 image coordinates (y up); convert them once.
function fromV1(s) { return { id: s.id, name: s.name, notes: s.notes || '', lat: (s.lat - 8192) / 32, lng: s.lng / 32 }; }
function load() {
  try {
    const v2 = JSON.parse(localStorage.getItem(KEY));
    if (Array.isArray(v2)) return v2;
    const v1 = JSON.parse(localStorage.getItem(OLD_KEY));
    if (Array.isArray(v1)) { const s = v1.map(fromV1); localStorage.setItem(KEY, JSON.stringify(s)); return s; }
  } catch {}
  return [];
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(spots)); } catch {} }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const pinIcon = L.divIcon({
  className: '', iconSize: [30, 40], iconAnchor: [15, 38], popupAnchor: [0, -36],
  html: '<div class="pin"><i class="fa-solid fa-location-pin"></i><i class="fa-solid fa-car-side"></i></div>',
});

function formHtml(s = {}) {
  return `<form>
    <label>Name</label><input name="name" required value="${esc(s.name)}" placeholder="e.g. LS Car Meet">
    <label>Notes</label><textarea name="notes" placeholder="Best time, vibe, who goes">${esc(s.notes)}</textarea>
    <div class="row"><button class="primary" type="submit"><i class="fa-solid fa-check"></i> Save</button><button type="button" data-cancel>Cancel</button></div>
  </form>`;
}
function viewHtml(s) {
  return `<div class="pop">
    <h3>${esc(s.name)}</h3>
    ${s.notes ? `<div class="notes">${esc(s.notes)}</div>` : ''}
    <div class="row">
      <button data-edit><i class="fa-solid fa-pen"></i> Edit</button>
      <button data-move><i class="fa-solid fa-up-down-left-right"></i> Move</button>
      <button class="danger" data-del><i class="fa-solid fa-trash"></i> Delete</button>
    </div>
  </div>`;
}

function wireForm(popup, existing, latlng) {
  const el = popup.getElement();
  const form = el.querySelector('form');
  form.name.focus();
  form.addEventListener('submit', e => {
    e.preventDefault();
    const data = { name: form.name.value.trim() || 'Untitled', notes: form.notes.value.trim() };
    if (existing) { Object.assign(existing, data); save(); render(); openSpot(existing); return; }
    const s = { id: Date.now().toString(36), lat: latlng.lat, lng: latlng.lng, ...data };
    spots.push(s); map.closePopup(); save(); render(); openSpot(s);
  });
  el.querySelector('[data-cancel]').addEventListener('click', () => existing ? openSpot(existing) : map.closePopup());
}

let moving = null;
map.on('click', e => {
  if (moving) {
    Object.assign(moving, { lat: e.latlng.lat, lng: e.latlng.lng });
    const s = moving; moving = null; map.getContainer().style.cursor = '';
    save(); render(); openSpot(s);
    return;
  }
  const popup = L.popup().setLatLng(e.latlng).setContent(formHtml()).openOn(map);
  wireForm(popup, null, e.latlng);
});

function openSpot(s) {
  const m = markers[s.id];
  m.bindPopup(viewHtml(s)).openPopup();
  const el = m.getPopup().getElement();
  el.querySelector('[data-edit]').onclick = () => { m.setPopupContent(formHtml(s)); wireForm(m.getPopup(), s); };
  el.querySelector('[data-move]').onclick = () => { moving = s; m.closePopup(); map.getContainer().style.cursor = 'crosshair'; };
  const del = el.querySelector('[data-del]');
  del.onclick = () => {
    if (del.dataset.sure) { spots = spots.filter(x => x !== s); save(); render(); }
    else { del.dataset.sure = 1; del.innerHTML = '<i class="fa-solid fa-trash"></i> Really delete?'; }
  };
}

function render() {
  Object.values(markers).forEach(m => m.remove());
  for (const k in markers) delete markers[k];
  for (const s of spots) {
    const m = L.marker([s.lat, s.lng], { icon: pinIcon, title: s.name }).addTo(map);
    m.on('click', () => openSpot(s));
    markers[s.id] = m;
  }
  renderList();
}

function renderList() {
  const q = document.getElementById('search').value.toLowerCase();
  const list = document.getElementById('list');
  const shown = spots.filter(s => (s.name + ' ' + s.notes).toLowerCase().includes(q));
  list.innerHTML = shown.length ? shown.map(s => `<div class="item" data-id="${s.id}">
      <i class="fa-solid fa-location-dot"></i>
      <div><b>${esc(s.name)}</b>${s.notes ? `<span>${esc(s.notes.slice(0, 60))}</span>` : ''}</div>
    </div>`).join('')
    : `<div class="empty">${spots.length ? 'No matches.' : 'No spots yet. Click the map to add one.'}</div>`;
  list.querySelectorAll('.item').forEach(el => el.onclick = () => {
    const s = spots.find(x => x.id === el.dataset.id);
    map.flyTo([s.lat, s.lng], 4, { duration: 0.6 });
    map.once('moveend', () => openSpot(s));
  });
}
document.getElementById('search').addEventListener('input', renderList);

document.getElementById('export').onclick = () => {
  const blob = new Blob([JSON.stringify(spots, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'spots.json'; a.click();
  URL.revokeObjectURL(a.href);
};
document.getElementById('import').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    let data = JSON.parse(await f.text());
    if (Array.isArray(data)) {
      // Old exports have coordinates in 0..8192.
      data = data.filter(s => s && typeof s.lat === 'number').map(s => s.lat > 0 || s.lng > EXTENT ? fromV1(s) : s);
      const ids = new Set(spots.map(s => s.id));
      spots = spots.concat(data.filter(s => !ids.has(s.id)));
      save(); render();
    }
  } catch {}
  e.target.value = '';
};

// First visit on a new device: load spots.json from the repo if there is one.
if (!spots.length) {
  fetch('spots.json').then(r => r.ok ? r.json() : []).then(d => {
    if (Array.isArray(d) && d.length && !spots.length) {
      spots = d.map(s => s.lat > 0 || s.lng > EXTENT ? fromV1(s) : s); save(); render();
    }
  }).catch(() => {});
}
render();
</script>
</body>
</html>
