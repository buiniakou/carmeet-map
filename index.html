<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Car Meet Spots</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  :root {
    --page:#f2f3ec; --card:#ffffff; --soft:#f1f2ea; --line:#e2e4d6;
    --ink:#1f1f22; --muted:#7a7a80; --dark:#2a2e22; --accent:#6b7d2a; --accent-hi:#7f9434; --green:#8aa83a;
    --shadow:0 8px 28px rgba(20,20,30,.16);
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--page); color:var(--ink);
    font:15px/1.4 'Inter Tight', system-ui, -apple-system, sans-serif; letter-spacing:-0.01em; }
  button, input { font:inherit; color:inherit; letter-spacing:inherit; }

  /* Full-screen app: sidebar + map filling the rest of the window */
  .app { display:flex; height:100vh; height:100dvh; }

  .side { width:380px; flex:none; background:var(--page); display:flex; flex-direction:column; gap:18px;
    padding:20px; min-height:0; }
  .logo { align-self:flex-start; display:flex; align-items:center; gap:10px; background:var(--card); border-radius:999px;
    padding:12px 22px; font-weight:600; font-size:20px; }
  .logo i { color:var(--accent); }

  .search { display:flex; align-items:center; gap:12px; border-bottom:1px solid #d9d9dd; padding-bottom:12px; }
  .search input { flex:1; min-width:0; border:0; background:transparent; outline:none; font-size:36px; font-weight:400;
    letter-spacing:-0.04em; }
  .search input::placeholder { color:var(--ink); }

  .stats { display:flex; gap:32px; }
  .stat small { display:block; color:#444; font-size:14px; margin-bottom:4px; }
  .stat b { font-size:42px; font-weight:400; letter-spacing:-0.04em; line-height:1; }
  .chip { display:inline-block; vertical-align:middle; margin-left:8px; padding:3px 8px; border-radius:999px;
    font-size:12px; color:#fff; background:var(--green); font-weight:500; letter-spacing:0; }

  .circle { width:48px; height:48px; border-radius:50%; background:var(--card); border:0; display:grid; place-items:center;
    cursor:pointer; font-size:16px; color:var(--ink); flex:none; }
  .circle:hover { background:#ececee; }
  .circle.sm { width:40px; height:40px; font-size:14px; }
  .circle.dark { background:var(--dark); color:#fff; }
  .circle.dark:hover { background:#3a3a3d; }

  .card { background:var(--card); border-radius:28px; padding:20px; min-width:0; }
  .card-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .card h2 { margin:0; font-size:24px; font-weight:400; letter-spacing:-0.03em; line-height:1.15; }

  .hint { background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .hint .circle { background:rgba(255,255,255,.22); color:#fff; }
  .hint .count { display:flex; align-items:flex-end; gap:10px; }
  .hint .count b { font-size:56px; font-weight:300; line-height:.9; letter-spacing:-0.05em; }
  .hint .count span { font-size:13px; line-height:1.2; padding-bottom:4px; opacity:.92; }
  .hint p { margin:6px 0 0; font-size:13px; opacity:.92; display:flex; align-items:center; gap:6px; }

  .list-card { flex:1; display:flex; flex-direction:column; min-height:0; }
  #list { flex:1; overflow-y:auto; margin:14px -6px 0; padding:0 6px; display:flex; flex-direction:column; gap:8px; }
  .item { display:flex; align-items:center; gap:12px; background:var(--soft); border-radius:20px; padding:10px 12px;
    cursor:pointer; border:1px solid transparent; }
  .item:hover { border-color:var(--line); background:#efeff1; }
  .item .dot { width:36px; height:36px; border-radius:50%; background:var(--c, var(--accent)); color:#fff; display:grid;
    place-items:center; font-size:13px; flex:none; }
  /* Several tags: overlapping circles, like the avatar stack in the reference */
  .dots { display:flex; flex:none; }
  .dots .dot { border:2px solid var(--soft); }
  .dots .dot + .dot { margin-left:-14px; }
  .item div { min-width:0; flex:1; }
  .item .time { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .item b { display:block; font-weight:500; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .time { display:inline-flex; align-items:center; gap:6px; color:var(--muted); font-size:13px; }
  .empty { color:var(--muted); padding:16px 4px; }

  /* Map: fills everything right of the sidebar, controls float on top */
  .map-card { position:relative; flex:1; min-width:0; }
  #map { position:absolute; inset:0; background:#1d3a52; }
  .float { position:absolute; z-index:5; display:flex; gap:10px; align-items:center; }
  .float .circle, .float .pillbar, .float .tag { box-shadow:var(--shadow); }
  .float.top { top:18px; left:18px; right:18px; justify-content:space-between; pointer-events:none; }
  .float.top > * { pointer-events:auto; }
  .pillbar { display:flex; gap:4px; background:var(--card); border-radius:999px; padding:6px; }
  .pillbar button { padding:10px 20px; border-radius:999px; border:0; background:transparent; cursor:pointer; white-space:nowrap; }
  .pillbar button:hover { background:var(--soft); }
  .pillbar button.on { background:var(--dark); color:#fff; }
  .float .actions { display:flex; gap:10px; margin-left:auto; }
  .tag { background:var(--card); border-radius:999px; padding:12px 18px; display:flex; align-items:center; gap:8px; }
  .tag i { color:var(--accent); }
  .tag.moving { background:var(--dark); color:#fff; }
  .float.bottom { left:18px; bottom:18px; }
  .zoom { position:absolute; z-index:5; right:18px; bottom:18px; display:flex; flex-direction:column; gap:8px; }
  .zoom .circle { box-shadow:var(--shadow); }

  /* Popups: dark card like the "Upcoming meeting" panel */
  .maplibregl-popup-content { background:var(--dark); color:#fff; border-radius:26px; padding:20px; width:280px;
    box-shadow:0 12px 32px rgba(0,0,0,.3); font:inherit; }
  .maplibregl-popup-anchor-bottom .maplibregl-popup-tip { border-top-color:var(--dark); }
  .maplibregl-popup-anchor-top .maplibregl-popup-tip { border-bottom-color:var(--dark); }
  .maplibregl-popup-anchor-left .maplibregl-popup-tip { border-right-color:var(--dark); }
  .maplibregl-popup-anchor-right .maplibregl-popup-tip { border-left-color:var(--dark); }
  .pop .x { position:absolute; top:14px; right:14px; width:32px; height:32px; border-radius:50%; border:0; cursor:pointer;
    background:rgba(255,255,255,.12); color:#fff; display:grid; place-items:center; }
  .pop .x:hover { background:rgba(255,255,255,.2); }
  .pop h3 { margin:0 40px 10px 0; font-size:24px; font-weight:400; letter-spacing:-0.03em; line-height:1.15; word-break:break-word; }
  .pop .badge { display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.12); border-radius:999px;
    padding:4px 10px; font-size:13px; margin:0 4px 4px 0; }
  .pop .badge.type { background:var(--c); }
  .row { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  .btn { display:inline-flex; align-items:center; gap:7px; border:0; border-radius:999px; padding:9px 14px; cursor:pointer;
    background:rgba(255,255,255,.12); color:#fff; font-size:14px; }
  .btn:hover { background:rgba(255,255,255,.2); }
  .btn.accent { background:var(--accent); }
  .btn.accent:hover { background:var(--accent-hi); }
  .btn.danger { color:#ff9aa1; }
  .pop input[name=name] { width:100%; padding:10px 14px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14);
    border-radius:14px; color:#fff; outline:none; }
  .pop input[name=name]:focus { border-color:var(--accent); }
  .types { display:flex; gap:6px; flex-wrap:wrap; margin-top:12px; }
  .types label { cursor:pointer; }
  .types input { position:absolute; opacity:0; pointer-events:none; }
  .types span { display:inline-flex; align-items:center; gap:6px; padding:7px 12px; border-radius:999px; font-size:13px;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); }
  .types span i { color:var(--c); }
  .types input:checked + span { background:var(--c); border-color:var(--c); }
  .types input:checked + span i { color:#fff; }
  .types input:focus-visible + span { outline:2px solid #fff; outline-offset:2px; }

  .pin { width:34px; height:44px; cursor:pointer; }
  .pin .fa-location-pin { position:absolute; inset:0; font-size:44px; color:var(--c, var(--accent)); filter:drop-shadow(0 3px 4px rgba(0,0,0,.45)); }
  .pin .glyph { position:absolute; left:50%; top:10px; transform:translateX(-50%); font-size:14px; color:#fff; }
  .pin .more { position:absolute; left:26px; top:-6px; display:flex; }
  .pin .more i { width:20px; height:20px; border-radius:50%; background:var(--c); color:#fff; font-size:10px;
    display:grid; place-items:center; border:2px solid #fff; box-shadow:0 2px 4px rgba(0,0,0,.35); }
  .pin .more i + i { margin-left:-6px; }

  @media (max-width: 1000px) {
    .side { width:320px; }
    .pillbar { display:none; }
  }
  /* Phone: map on top, panel below as a sheet; still no page scroll */
  @media (max-width: 700px) {
    .app { flex-direction:column-reverse; }
    .side { width:100%; height:42%; padding:14px 16px; gap:12px; border-radius:24px 24px 0 0; margin-top:-24px;
      position:relative; z-index:6; box-shadow:0 -8px 24px rgba(0,0,0,.15); }
    .logo, .hint { display:none; }
    .search input { font-size:26px; }
    .search { padding-bottom:8px; }
    .stats { gap:24px; }
    .stat b { font-size:30px; }
    .stat small { font-size:12px; }
    .list-card { padding:0; background:transparent; }
    .list-card .card-head { display:none; }
    #list { margin-top:0; }
    .circle { width:44px; height:44px; }
    .float.top { top:12px; left:12px; right:12px; }
    .zoom { right:12px; bottom:36px; }
    .float.bottom { display:none; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><i class="fa-solid fa-car-side"></i> Car Meets</div>
    <label class="search">
      <input id="search" placeholder="Search spots...">
      <span class="circle sm"><i class="fa-solid fa-magnifying-glass"></i></span>
    </label>
    <div class="stats">
      <div class="stat"><small>Total Spots</small><b id="stat-total">0</b></div>
      <div class="stat"><small>Added This Week</small><b id="stat-week">0</b><span class="chip" id="stat-week-chip" hidden>new</span></div>
    </div>
    <div class="card hint">
      <div>
        <div class="count"><b id="count">0</b><span>spots<br>saved</span></div>
        <p><i class="fa-solid fa-circle-plus"></i> Click the map to drop a spot</p>
      </div>
      <button class="circle sm" id="hint-fit" title="Show whole map"><i class="fa-solid fa-arrow-right-long" style="transform:rotate(-45deg)"></i></button>
    </div>
    <div class="card list-card">
      <div class="card-head"><h2>Saved Spots</h2></div>
      <div id="list"></div>
    </div>
  </aside>

  <main class="map-card">
    <div id="map"></div>
    <div class="float top">
      <div class="pillbar" id="nav">
        <button data-area="all" class="on">Whole Map</button><button data-area="ls">Los Santos</button><button data-area="bc">Blaine County</button>
      </div>
      <div class="actions">
        <button class="circle" id="export" title="Export spots"><i class="fa-solid fa-arrow-up-from-bracket"></i></button>
        <label class="circle" title="Import spots"><i class="fa-solid fa-file-import"></i><input id="import" type="file" accept=".json" hidden></label>
        <button class="circle dark" id="fit" title="Show whole map"><i class="fa-solid fa-expand"></i></button>
      </div>
    </div>
    <div class="float bottom"><div class="tag" id="tag"><i class="fa-solid fa-location-dot"></i> GTA V Satellite</div></div>
    <div class="zoom">
      <button class="circle" id="zin" title="Zoom in"><i class="fa-solid fa-plus"></i></button>
      <button class="circle" id="zout" title="Zoom out"><i class="fa-solid fa-minus"></i></button>
    </div>
  </main>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
// The 8192x8192 px map is cut into 256px tiles, zooms 0-5 (tiles/{z}/{y}/{x}.jpg).
// MapLibre needs a "world" bigger than the image (otherwise it won't zoom out far enough
// to show the whole map), so the image sits in the middle quarter of a world 4x its size:
// world tile (z, x, y) = image tile (z - 2, x - 3*2^(z-3), y - 3*2^(z-3)).
// Spots are stored in image pixels (x, y from the top-left).
const SIZE = 8192;
const WORLD = SIZE * 4, OFFSET = SIZE * 1.5;
const KEY = 'carmeet-spots-v3';

const toLngLat = (x, y) => {
  const wx = (x + OFFSET) / WORLD, wy = (y + OFFSET) / WORLD;
  return [wx * 360 - 180, Math.atan(Math.sinh(Math.PI * (1 - 2 * wy))) * 180 / Math.PI];
};
const toPx = ({ lng, lat }) => {
  const r = lat * Math.PI / 180;
  const wx = (lng + 180) / 360, wy = (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2;
  return { x: wx * WORLD - OFFSET, y: wy * WORLD - OFFSET };
};
const pxBounds = (x1, y1, x2, y2) => [toLngLat(x1, y2), toLngLat(x2, y1)];

const BASE = location.href.split(/[?#]/)[0].replace(/[^/]*$/, '');
const map = new maplibregl.Map({
  container: 'map',
  transformRequest: url => {
    const m = url.match(/\/gta\/(\d+)\/(\d+)\/(\d+)$/);
    if (!m) return { url };
    const [z, x, y] = m.slice(1).map(Number), off = 3 * 2 ** (z - 3);
    return { url: `${BASE}tiles/${z - 2}/${y - off}/${x - off}.jpg` };
  },
  style: {
    version: 8,
    sources: { gta: {
      type: 'raster', tiles: [BASE + 'gta/{z}/{x}/{y}'],
      // 128 makes MapLibre fetch one level deeper than the screen zoom: crisp on Retina screens.
      tileSize: 128, minzoom: 3, maxzoom: 7,
      bounds: [...toLngLat(0, SIZE), ...toLngLat(SIZE, 0)],
    } },
    layers: [
      { id: 'bg', type: 'background', paint: { 'background-color': '#1d3a52' } },
      { id: 'gta', type: 'raster', source: 'gta', paint: { 'raster-fade-duration': 0, 'raster-resampling': 'linear' } },
    ],
  },
  bounds: pxBounds(0, 0, SIZE, SIZE),
  fitBoundsOptions: { padding: 20 },
  renderWorldCopies: false, dragRotate: false, pitchWithRotate: false, touchPitch: false,
  attributionControl: false, maxZoom: 6.5, minZoom: 1,
});
map.touchZoomRotate.disableRotation();
map.keyboard.disableRotation();

const AREAS = {
  all: pxBounds(0, 0, SIZE, SIZE),
  ls: pxBounds(3040, 5600, 5280, 7840),
  bc: pxBounds(2240, 800, 6400, 5600),
};
const nav = document.getElementById('nav');
function goArea(key) {
  map.fitBounds(AREAS[key], { padding: 20, duration: 700 });
  nav.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.area === key));
}
nav.querySelectorAll('button').forEach(b => b.onclick = () => goArea(b.dataset.area));
['fit', 'hint-fit'].forEach(id => document.getElementById(id).onclick = () => goArea('all'));
document.getElementById('zin').onclick = () => map.zoomIn({ duration: 300 });
document.getElementById('zout').onclick = () => map.zoomOut({ duration: 300 });
new ResizeObserver(() => map.resize()).observe(document.getElementById('map'));

// ---- Spot types ----
const TYPES = {
  meet:   { label: 'Car meet',     color: '#6b7d2a', icon: 'fa-car-side' },
  cruise: { label: 'Cruise route', color: '#3b82f6', icon: 'fa-route' },
  photo:  { label: 'Photo spot',   color: '#a855f7', icon: 'fa-camera' },
};
// A spot has one or more tags; the first one picks the pin colour and icon.
const tagsOf = s => s.tags.map(k => TYPES[k]);
const tagLabels = s => tagsOf(s).map(t => t.label).join(', ');

// ---- Storage (older versions used other coordinates; convert them once) ----
function cleanTags(s) {
  const raw = Array.isArray(s.tags) ? s.tags : [s.type];
  const tags = Object.keys(TYPES).filter(k => raw.includes(k));
  return tags.length ? tags : ['meet'];
}
const clean = s => ({ id: String(s.id), name: String(s.name || 'Untitled'), tags: cleanTags(s),
  x: s.x, y: s.y, createdAt: s.createdAt });
function migrate(s) {
  if (typeof s.x === 'number') return clean(s);
  if (typeof s.lat !== 'number') return null;
  if (s.lat > 0 || s.lng > 256) return clean({ ...s, x: s.lng, y: SIZE - s.lat });   // v1: 0..8192, y up
  return clean({ ...s, x: s.lng * 32, y: -s.lat * 32 });                            // v2: 0..256, lat down
}
function load() {
  try {
    for (const k of [KEY, 'carmeet-spots-v2', 'carmeet-spots-v1']) {
      const d = JSON.parse(localStorage.getItem(k));
      if (Array.isArray(d)) { const s = d.map(migrate).filter(Boolean); if (k !== KEY) localStorage.setItem(KEY, JSON.stringify(s)); return s; }
    }
  } catch {}
  return [];
}
let spots = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(spots)); } catch {} }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function ago(t) {
  if (!t) return 'Saved';
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return 'Just now';
  if (m < 60) return m + 'm ago';
  const h = Math.round(m / 60);
  if (h < 24) return h + 'h ago';
  const d = Math.round(h / 24);
  return d < 30 ? d + 'd ago' : new Date(t).toLocaleDateString();
}

// ---- One popup, filled with real DOM so clicks inside never reach the map ----
const popup = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 38, maxWidth: 'none' });
function showPopup(lngLat, html, wire, offset = 38) {
  const el = document.createElement('div');
  el.className = 'pop';
  el.innerHTML = `<button class="x" title="Close"><i class="fa-solid fa-xmark"></i></button>${html}`;
  el.querySelector('.x').onclick = () => popup.remove();
  wire(el);
  popup.setOffset(offset).setLngLat(lngLat).setDOMContent(el).addTo(map);
}

function openForm(lngLat, existing) {
  showPopup(lngLat, `<form>
      <h3>${existing ? 'Edit Spot' : 'New Spot'}</h3>
      <input name="name" required maxlength="80" value="${esc(existing?.name)}" placeholder="e.g. LS Car Meet" autocomplete="off">
      <div class="types">${Object.entries(TYPES).map(([k, t]) => `<label style="--c:${t.color}">
        <input type="checkbox" name="tag" value="${k}" ${(existing?.tags || ['meet']).includes(k) ? 'checked' : ''}>
        <span><i class="fa-solid ${t.icon}"></i> ${t.label}</span></label>`).join('')}</div>
      <div class="row"><button class="btn accent" type="submit"><i class="fa-solid fa-check"></i> Save</button><button class="btn" type="button" data-cancel>Cancel</button></div>
    </form>`, el => {
    const form = el.querySelector('form');
    setTimeout(() => form.name.focus(), 0);
    form.onsubmit = e => {
      e.preventDefault();
      const name = form.name.value.trim() || 'Untitled';
      const tags = cleanTags({ tags: [...form.querySelectorAll('input[name=tag]:checked')].map(i => i.value) });
      if (existing) { Object.assign(existing, { name, tags }); save(); render(); openSpot(existing); return; }
      const { x, y } = toPx(lngLat);
      const s = { id: Date.now().toString(36), name, tags, x, y, createdAt: Date.now() };
      spots.unshift(s); save(); render(); openSpot(s);
    };
    el.querySelector('[data-cancel]').onclick = () => existing ? openSpot(existing) : popup.remove();
  }, existing ? 38 : 8);
}

function openSpot(s) {
  showPopup(toLngLat(s.x, s.y), `
    <h3>${esc(s.name)}</h3>
    ${tagsOf(s).map(t => `<span class="badge type" style="--c:${t.color}"><i class="fa-solid ${t.icon}"></i> ${t.label}</span>`).join('')}
    <span class="badge"><i class="fa-regular fa-clock"></i> ${ago(s.createdAt)}</span>
    <div class="row">
      <button class="btn" data-edit><i class="fa-solid fa-pen"></i> Edit</button>
      <button class="btn" data-move><i class="fa-solid fa-up-down-left-right"></i> Move</button>
      <button class="btn danger" data-del><i class="fa-solid fa-trash"></i> Delete</button>
    </div>`, el => {
    el.querySelector('[data-edit]').onclick = () => openForm(toLngLat(s.x, s.y), s);
    el.querySelector('[data-move]').onclick = () => { popup.remove(); setMoving(s); };
    const del = el.querySelector('[data-del]');
    del.onclick = () => {
      if (del.dataset.sure) { spots = spots.filter(x => x !== s); save(); render(); popup.remove(); }
      else { del.dataset.sure = 1; del.innerHTML = '<i class="fa-solid fa-trash"></i> Really delete?'; }
    };
  });
}

// ---- Map clicks: add a spot, or drop a spot being moved ----
const tag = document.getElementById('tag');
const TAG_DEFAULT = tag.innerHTML;
let moving = null;
function setMoving(s) {
  moving = s;
  map.getCanvas().style.cursor = s ? 'crosshair' : '';
  tag.classList.toggle('moving', !!s);
  tag.innerHTML = s ? `<i class="fa-solid fa-up-down-left-right"></i> Click the new place for ${esc(s.name)}` : TAG_DEFAULT;
}
map.on('click', e => {
  const t = e.originalEvent.target;
  if (!t.isConnected || t.closest('.maplibregl-popup, .maplibregl-marker')) return;
  const { x, y } = toPx(e.lngLat);
  if (x < 0 || y < 0 || x > SIZE || y > SIZE) { popup.remove(); return; }
  if (moving) {
    const s = moving; s.x = x; s.y = y;
    setMoving(null); save(); render(); openSpot(s);
    return;
  }
  openForm(e.lngLat, null);
});

// ---- Markers + list ----
const markers = new Map();
function render() {
  markers.forEach(m => m.remove());
  markers.clear();
  for (const s of spots) {
    const el = document.createElement('div');
    el.className = 'pin';
    el.title = s.name;
    const [first, ...rest] = tagsOf(s);
    el.title = `${s.name} (${tagLabels(s)})`;
    el.style.setProperty('--c', first.color);
    el.innerHTML = `<i class="fa-solid fa-location-pin"></i><i class="fa-solid ${first.icon} glyph"></i>`
      + (rest.length ? `<span class="more">${rest.map(t => `<i style="--c:${t.color}" class="fa-solid ${t.icon}"></i>`).join('')}</span>` : '');
    el.addEventListener('click', e => { e.stopPropagation(); openSpot(s); });
    markers.set(s.id, new maplibregl.Marker({ element: el, anchor: 'bottom' }).setLngLat(toLngLat(s.x, s.y)).addTo(map));
  }
  const week = spots.filter(s => s.createdAt && Date.now() - s.createdAt < 7 * 864e5).length;
  document.getElementById('stat-total').textContent = spots.length;
  document.getElementById('count').textContent = spots.length;
  document.getElementById('stat-week').textContent = week;
  document.getElementById('stat-week-chip').hidden = !week;
  renderList();
}

function renderList() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const list = document.getElementById('list');
  const shown = spots.filter(s => (s.name + ' ' + tagLabels(s)).toLowerCase().includes(q));
  list.innerHTML = shown.length ? shown.map(s => `<div class="item" data-id="${esc(s.id)}">
      <span class="dots">${tagsOf(s).map(t => `<span class="dot" style="--c:${t.color}"><i class="fa-solid ${t.icon}"></i></span>`).join('')}</span>
      <div><b>${esc(s.name)}</b><span class="time">${tagLabels(s)} · ${ago(s.createdAt)}</span></div>
      <i class="fa-solid fa-chevron-right" style="color:var(--muted)"></i>
    </div>`).join('')
    : `<div class="empty">${spots.length ? 'No spots match your search.' : 'No spots yet. Click the map to add one.'}</div>`;
  list.querySelectorAll('.item').forEach(el => el.onclick = () => {
    const s = spots.find(x => x.id === el.dataset.id);
    popup.remove();
    map.flyTo({ center: toLngLat(s.x, s.y), zoom: Math.max(map.getZoom(), 4), duration: 800 });
    map.once('moveend', () => openSpot(s));
  });
}
document.getElementById('search').addEventListener('input', renderList);

// ---- Export / import ----
document.getElementById('export').onclick = () => {
  const blob = new Blob([JSON.stringify(spots, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'spots.json'; a.click();
  URL.revokeObjectURL(a.href);
};
document.getElementById('import').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (Array.isArray(data)) {
      const ids = new Set(spots.map(s => s.id));
      spots = spots.concat(data.map(migrate).filter(s => s && !ids.has(s.id)));
      save(); render();
    }
  } catch {}
  e.target.value = '';
};

// First visit on a new device: load spots.json from the repo if there is one.
if (!spots.length) {
  fetch('spots.json').then(r => r.ok ? r.json() : []).then(d => {
    if (Array.isArray(d) && d.length && !spots.length) { spots = d.map(migrate).filter(Boolean); save(); render(); }
  }).catch(() => {});
}
render();
setInterval(renderList, 60000);
</script>
</body>
</html>
