<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Car Meet Spots</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --bg:#111317; --panel:#1a1d23; --line:#2a2f38; --text:#e8eaed; --muted:#9aa0a6; --accent:#ff4d4d; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px/1.4 system-ui, -apple-system, sans-serif; }
  #app { display:flex; height:100%; }
  #side { width:300px; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; }
  #side header { padding:14px 16px; border-bottom:1px solid var(--line); }
  #side h1 { margin:0 0 4px; font-size:18px; }
  #side p { margin:0; color:var(--muted); font-size:12px; }
  #search { margin:10px 16px; padding:8px 10px; background:var(--bg); border:1px solid var(--line); color:var(--text); border-radius:6px; }
  #list { flex:1; overflow-y:auto; padding:0 8px; }
  .item { padding:10px; border-radius:6px; cursor:pointer; border-bottom:1px solid var(--line); }
  .item:hover { background:#232730; }
  .item b { display:block; }
  .item span { color:var(--muted); font-size:12px; }
  .empty { color:var(--muted); padding:16px 8px; }
  #tools { padding:12px 16px; border-top:1px solid var(--line); display:flex; gap:8px; flex-wrap:wrap; }
  button, .btn { background:#2a2f38; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:7px 10px; cursor:pointer; font:inherit; }
  button:hover, .btn:hover { background:#353b46; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger { color:#ff8a8a; }
  #map { flex:1; background:#0b3d5c; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background:var(--panel); color:var(--text); }
  .leaflet-popup-content { margin:12px; min-width:220px; }
  .leaflet-container a.leaflet-popup-close-button { color:var(--muted); }
  form label { display:block; font-size:12px; color:var(--muted); margin:8px 0 3px; }
  form input, form textarea, form select { width:100%; padding:6px 8px; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:5px; font:inherit; }
  form textarea { min-height:60px; resize:vertical; }
  .row { display:flex; gap:6px; margin-top:10px; }
  .pin { width:22px; height:22px; border-radius:50% 50% 50% 0; transform:rotate(-45deg); border:2px solid #fff; box-shadow:0 1px 4px #000a; }
  .pop h3 { margin:0 0 4px; font-size:15px; }
  .pop .tag { display:inline-block; font-size:11px; padding:1px 6px; border-radius:10px; background:#2a2f38; margin-bottom:6px; }
  .pop .notes { white-space:pre-wrap; color:#cfd3d8; }
  @media (max-width: 700px) {
    #app { flex-direction:column-reverse; }
    #side { width:100%; height:40%; border-right:0; border-top:1px solid var(--line); }
  }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <header>
      <h1>🚗 Car Meet Spots</h1>
      <p>Click anywhere on the map to drop a spot.</p>
    </header>
    <input id="search" placeholder="Search spots…">
    <div id="list"></div>
    <div id="tools">
      <button id="export">Export</button>
      <label class="btn">Import<input id="import" type="file" accept=".json" hidden></label>
    </div>
  </aside>
  <div id="map"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const SIZE = 8192;
const KEY = 'carmeet-spots-v1';
const TYPES = {
  meet:    { label: 'Car meet',   color: '#ff4d4d' },
  cruise:  { label: 'Cruise route', color: '#4da3ff' },
  photo:   { label: 'Photo spot', color: '#ffc14d' },
  drift:   { label: 'Drift / race', color: '#b36bff' },
  other:   { label: 'Other',      color: '#4dd68c' },
};

const map = L.map('map', { crs: L.CRS.Simple, minZoom: -5, maxZoom: 1, zoomSnap: 0.25, attributionControl: false });
const bounds = [[0, 0], [SIZE, SIZE]];
L.imageOverlay('map.jpg', bounds).addTo(map);
map.fitBounds(bounds);
map.setMaxBounds([[-SIZE * 0.2, -SIZE * 0.2], [SIZE * 1.2, SIZE * 1.2]]);

let spots = load();
const markers = {};

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(spots)); } catch {}
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function icon(type) {
  const c = (TYPES[type] || TYPES.other).color;
  return L.divIcon({ className: '', html: `<div class="pin" style="background:${c}"></div>`, iconSize: [22, 22], iconAnchor: [11, 26], popupAnchor: [0, -24] });
}

function formHtml(s = {}) {
  const opts = Object.entries(TYPES).map(([k, t]) => `<option value="${k}" ${s.type === k ? 'selected' : ''}>${t.label}</option>`).join('');
  return `<form>
    <label>Name</label><input name="name" required value="${esc(s.name)}" placeholder="e.g. LS Car Meet">
    <label>Type</label><select name="type">${opts}</select>
    <label>Notes</label><textarea name="notes" placeholder="Best time, vibe, who goes…">${esc(s.notes)}</textarea>
    <div class="row"><button class="primary" type="submit">Save</button><button type="button" data-cancel>Cancel</button></div>
  </form>`;
}

function viewHtml(s) {
  const t = TYPES[s.type] || TYPES.other;
  return `<div class="pop">
    <h3>${esc(s.name)}</h3>
    <span class="tag" style="color:${t.color}">${t.label}</span>
    ${s.notes ? `<div class="notes">${esc(s.notes)}</div>` : ''}
    <div class="row"><button data-edit>Edit</button><button data-move>Move</button><button class="danger" data-del>Delete</button></div>
  </div>`;
}

function wireForm(popup, existing, latlng) {
  const el = popup.getElement();
  const form = el.querySelector('form');
  form.name.focus();
  form.addEventListener('submit', e => {
    e.preventDefault();
    const data = { name: form.name.value.trim() || 'Untitled', type: form.type.value, notes: form.notes.value.trim() };
    if (existing) {
      Object.assign(existing, data);
      save(); render(); openSpot(existing);
    } else {
      const s = { id: Date.now().toString(36), lat: latlng.lat, lng: latlng.lng, ...data };
      spots.push(s);
      map.closePopup(); save(); render(); openSpot(s);
    }
  });
  el.querySelector('[data-cancel]').addEventListener('click', () => existing ? openSpot(existing) : map.closePopup());
}

let moving = null;
map.on('click', e => {
  if (moving) {
    moving.lat = e.latlng.lat; moving.lng = e.latlng.lng;
    const s = moving; moving = null; map.getContainer().style.cursor = '';
    save(); render(); openSpot(s);
    return;
  }
  const popup = L.popup().setLatLng(e.latlng).setContent(formHtml({ type: 'meet' })).openOn(map);
  wireForm(popup, null, e.latlng);
});

function openSpot(s) {
  const m = markers[s.id];
  m.bindPopup(viewHtml(s)).openPopup();
  const el = m.getPopup().getElement();
  el.querySelector('[data-edit]').onclick = () => {
    m.setPopupContent(formHtml(s));
    wireForm(m.getPopup(), s);
  };
  el.querySelector('[data-move]').onclick = () => {
    moving = s; m.closePopup(); map.getContainer().style.cursor = 'crosshair';
  };
  el.querySelector('[data-del]').onclick = () => {
    if (el.querySelector('[data-del]').dataset.sure) {
      spots = spots.filter(x => x !== s); save(); render();
    } else {
      el.querySelector('[data-del]').dataset.sure = 1;
      el.querySelector('[data-del]').textContent = 'Really delete?';
    }
  };
}

function render() {
  Object.values(markers).forEach(m => m.remove());
  for (const k in markers) delete markers[k];
  for (const s of spots) {
    const m = L.marker([s.lat, s.lng], { icon: icon(s.type), title: s.name }).addTo(map);
    m.on('click', () => openSpot(s));
    markers[s.id] = m;
  }
  renderList();
}

function renderList() {
  const q = document.getElementById('search').value.toLowerCase();
  const list = document.getElementById('list');
  const shown = spots.filter(s => (s.name + ' ' + s.notes).toLowerCase().includes(q));
  list.innerHTML = shown.length ? shown.map(s => {
    const t = TYPES[s.type] || TYPES.other;
    return `<div class="item" data-id="${s.id}"><b><span style="color:${t.color}">●</span> ${esc(s.name)}</b><span>${t.label}${s.notes ? ' · ' + esc(s.notes.slice(0, 50)) : ''}</span></div>`;
  }).join('') : `<div class="empty">${spots.length ? 'No matches.' : 'No spots yet — click the map to add one.'}</div>`;
  list.querySelectorAll('.item').forEach(el => el.onclick = () => {
    const s = spots.find(x => x.id === el.dataset.id);
    map.flyTo([s.lat, s.lng], 0, { duration: 0.6 });
    setTimeout(() => openSpot(s), 650);
  });
}
document.getElementById('search').addEventListener('input', renderList);

document.getElementById('export').onclick = () => {
  const blob = new Blob([JSON.stringify(spots, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'spots.json'; a.click();
  URL.revokeObjectURL(a.href);
};
document.getElementById('import').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (Array.isArray(data)) {
      const ids = new Set(spots.map(s => s.id));
      spots = spots.concat(data.filter(s => s && !ids.has(s.id) && typeof s.lat === 'number'));
      save(); render();
    }
  } catch {}
  e.target.value = '';
};

// First visit on a new device: load spots.json from the repo if there is one.
if (!spots.length) {
  fetch('spots.json').then(r => r.ok ? r.json() : []).then(d => {
    if (Array.isArray(d) && d.length && !spots.length) { spots = d; save(); render(); }
  }).catch(() => {});
}
render();
</script>
</body>
</html>
